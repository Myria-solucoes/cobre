name: Links

# External-URL link check for the user-facing docs. Repo-relative paths are
# validated separately by scripts/ci/check-doc-paths.sh; this job is http(s) only.
# Two triggers: every pull request (fast feedback, transient-tolerant) and a
# weekly cron (the authoritative stale-link sweep).
on:
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "book/src/**/*.md"
      - ".lycheeignore"
      - ".github/workflows/links.yml"
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: External link check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          # External http(s) only — repo-relative paths are check-doc-paths.sh's
          # job. External-host availability is inherently flaky (a third-party
          # site can be down at any moment), so on pull requests this check is
          # report-only and never blocks a merge (see `fail:` below); the weekly
          # cron and manual dispatch run authoritatively and fail on genuinely
          # broken links. Retries + accepted transient status codes further cut
          # false positives on those authoritative runs. .lycheeignore (repo
          # root) is read automatically.
          args: >-
            --no-progress
            --scheme https
            --scheme http
            --max-retries 3
            --retry-wait-time 2
            --accept 200,403,429
            README.md CONTRIBUTING.md 'book/src/**/*.md'
          # Do not open an issue on failure; surface the result via the job
          # status and the action's job summary. Fail the build on every trigger
          # EXCEPT pull_request, so a flaky external host cannot red-fail a PR
          # while the weekly cron / manual dispatch stay authoritative.
          fail: ${{ github.event_name != 'pull_request' }}
