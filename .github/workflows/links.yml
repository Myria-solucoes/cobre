name: Links

# External-URL link check for the user-facing docs. Repo-relative paths are
# validated separately by scripts/ci/check-doc-paths.sh; this job is http(s) only.
# Two triggers: every pull request (fast feedback, transient-tolerant) and a
# weekly cron (the authoritative stale-link sweep).
on:
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "book/src/**/*.md"
      - ".lycheeignore"
      - ".github/workflows/links.yml"
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: External link check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          # External http(s) only — repo-relative paths are check-doc-paths.sh's
          # job. Retries + accepted transient status codes keep PR runs from
          # red-failing on rate limits or flaky hosts; the weekly cron is the
          # authoritative sweep. .lycheeignore (repo root) is read automatically.
          args: >-
            --no-progress
            --scheme https
            --scheme http
            --max-retries 3
            --retry-wait-time 2
            --accept 200,403,429
            README.md CONTRIBUTING.md 'book/src/**/*.md'
          # Do not open an issue on failure; surface the result via the job
          # status (PR check) and the action's job summary.
          fail: true
