name: Release Myria runtime

# Produces matching immutable artifacts for both Linux architectures:
# the Linux CLI archive used on OCI and the matching Python wheel used by the
# bridge/validation worker.  This intentionally does not publish to PyPI.
on:
  push:
    tags:
      - 'v0.16.0-myria.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable GitHub Release tag (for example v0.16.0-myria.1)
        required: true
        default: v0.16.0-myria.1
      prerelease:
        description: Publish an opt-in preview without changing the latest release
        type: boolean
        default: true

      validate_only:
        description: Validate an existing optimized release without publishing artifacts
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    if: ${{ !inputs.validate_only }}
    name: Build and validate Linux runtime (${{ matrix.arch }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            manylinux: "2_34"
          - runner: ubuntu-24.04-arm
            arch: aarch64
            manylinux: "2_28"
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PRERELEASE: ${{ inputs.prerelease || false }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake

      - name: Validate native affinity and checkpoint integration
        run: |
          cargo test --locked -p cobre-comm --features affinity
          cargo test --locked -p cobre-sddp --lib convergence::risk_measure
          cargo test --locked -p cobre-io --lib validation::semantic
          cargo test --locked -p cobre-sddp --lib policy::policy_load
          cargo test --locked -p cobre-sddp --lib setup::params
          cargo test --locked -p cobre-sddp --features test-support --test mpi_wire progressive
          cargo test --locked -p cobre-cli --test cli_run --test cli_run_affinity

      - name: Build CLI archive
        run: |
          cargo build --release -p cobre-cli
          mkdir -p dist/cli
          cp target/release/cobre dist/cli/cobre
          tar --create --xz --file dist/cobre-cli-${{ matrix.arch }}-unknown-linux-gnu.tar.xz \
            --directory dist/cli cobre

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.arch }}-unknown-linux-gnu
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          working-directory: crates/cobre-python
          before-script-linux: |
            if command -v dnf &>/dev/null; then
              dnf install -y cmake
            else
              apt-get update && apt-get install -y cmake
            fi

      - name: Collect Python wheel
        run: cp crates/cobre-python/dist/*.whl dist/

      - name: Validate matching CLI and wheel
        run: |
          python -m pip install --no-deps dist/*.whl
          python -m pip install pytest numpy pyarrow
          python scripts/benchmarks/verify_runtime.py --cli dist/cli/cobre --case examples/4ree
          python -m pytest -q crates/cobre-python/tests/test_study.py crates/cobre-python/tests/test_affinity_parity.py crates/cobre-python/tests/test_errors.py --require-cli-binary

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.arch }}
          path: |
            dist/*.tar.xz
            dist/*.whl

  publish:
    if: ${{ !inputs.validate_only }}
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PRERELEASE: ${{ inputs.prerelease || false }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          merge-multiple: true
          path: dist
      - name: Publish immutable GitHub Release
        run: |
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -name '*.tar.xz' | wc -l)" -eq 2
          sha256sum dist/* > dist/SHA256SUMS
          release_options=()
          if [[ "$PRERELEASE" == "true" ]]; then
            release_options+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "${release_options[@]}" \
            --target "$GITHUB_SHA" \
            --title "Myria Cobre runtime ${RELEASE_TAG#v}" \
            --notes "Pinned Myria runtime built from ${GITHUB_SHA}. CLI and Python artifacts validated on native Linux x86_64 and ARM64." \
            dist/*.tar.xz dist/*.whl dist/SHA256SUMS

  validate:
    if: ${{ inputs.validate_only }}
    name: Validate published runtime (${{ matrix.arch }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      ARTIFACT_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          path: release-source
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download and verify published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json assets > release-assets.json
          gh release download "$RELEASE_TAG" --dir dist \
            --pattern "cobre-cli-${ARTIFACT_ARCH}-unknown-linux-gnu.tar.xz" \
            --pattern "*${ARTIFACT_ARCH}.whl"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          assets = {a['name']: a['digest'] for a in json.loads(Path('release-assets.json').read_text())['assets']}
          for artifact in Path('dist').iterdir():
              assert assets[artifact.name] == 'sha256:' + hashlib.sha256(artifact.read_bytes()).hexdigest()
          PY
          tar -xJf "dist/cobre-cli-${ARTIFACT_ARCH}-unknown-linux-gnu.tar.xz" -C dist
          python -m pip install --no-deps dist/*.whl
          python -m pip install pytest numpy pyarrow
      - name: Exercise CLI and Python runtime
        run: python scripts/benchmarks/verify_runtime.py --cli dist/cobre --case release-source/examples/4ree
