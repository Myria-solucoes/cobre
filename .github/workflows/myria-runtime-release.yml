name: Release Myria runtime

# Produces the two immutable artifacts consumed by Myria's Cobre worker:
# the Linux CLI archive used on OCI and the matching Python wheel used by the
# bridge/validation worker.  This intentionally does not publish to PyPI.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable GitHub Release tag (for example v0.15.0-myria.1)
        required: true
        default: v0.15.0-myria.1

permissions:
  contents: write

jobs:
  release:
    name: Build Linux runtime artifacts
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake

      - name: Build CLI archive
        run: |
          cargo build --release -p cobre-cli
          mkdir -p dist/cli
          cp target/release/cobre dist/cli/cobre
          tar --create --xz --file dist/cobre-cli-x86_64-unknown-linux-gnu.tar.xz \
            --directory dist/cli cobre

      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64-unknown-linux-gnu
          manylinux: "2_34"
          args: --release --out dist
          working-directory: crates/cobre-python
          before-script-linux: |
            if command -v dnf &>/dev/null; then
              dnf install -y cmake
            else
              apt-get update && apt-get install -y cmake
            fi

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(find dist -maxdepth 1 -name 'cobre_python-*.whl' | wc -l)" -eq 1
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Myria Cobre runtime ${RELEASE_TAG#v}" \
            --notes "Pinned Myria runtime built from ${GITHUB_SHA}." \
            dist/cobre-cli-x86_64-unknown-linux-gnu.tar.xz \
            dist/cobre_python-*.whl
