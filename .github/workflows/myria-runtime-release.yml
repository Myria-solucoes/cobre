name: Release Myria runtime

# Produces matching immutable artifacts for both Linux architectures:
# the Linux CLI archive used on OCI and the matching Python wheel used by the
# bridge/validation worker.  This intentionally does not publish to PyPI.
on:
  push:
    tags:
      - 'v0.18.0-myria.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable GitHub Release tag (for example v0.18.0-myria.1)
        required: true
        default: v0.18.0-myria.1
      prerelease:
        description: Publish an opt-in preview without changing the latest release
        type: boolean
        default: true

      validate_only:
        description: Validate an existing optimized release without publishing artifacts
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.repository == 'Myria-solucoes/cobre' && !inputs.validate_only }}
    name: Build and validate Linux runtime (${{ matrix.arch }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            manylinux: "2_34"
          - runner: ubuntu-24.04-arm
            arch: aarch64
            manylinux: "2_28"
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PRERELEASE: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate ported solver behavior
        run: |
          cargo test --locked -p cobre-io --lib stationarity
          cargo test --locked -p cobre-sddp --lib sparse_tests
          cargo test --locked -p cobre-sddp --lib point_selection
          cargo test --locked -p cobre-sddp --lib adaptive_batches_preserve_full_lp_value
          cargo test --locked -p cobre-sddp --lib fallback_includes_cuts_not_violated_until_reoptimization
          cargo test --locked -p cobre-sddp --features test-support --test deterministic progressive_forward
          cargo test --locked -p cobre-sddp --features test-support --test deterministic selected_sampled
          cargo test --locked -p cobre-sddp --features test-support --test mpi_wire scenario_claim_determinism
          cargo test --locked -p cobre-cli --test cli_run_affinity bound_and_unbound

      - name: Build CLI archive
        run: |
          cargo build --release -p cobre-cli
          mkdir -p dist/cli
          cp target/release/cobre dist/cli/cobre
          tar --create --xz --file dist/cobre-cli-${{ matrix.arch }}-unknown-linux-gnu.tar.xz \
            --directory dist/cli cobre

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.arch }}-unknown-linux-gnu
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          working-directory: crates/cobre-python
          before-script-linux: |
            if command -v dnf &>/dev/null; then
              dnf install -y cmake
            else
              apt-get update && apt-get install -y cmake
            fi

      - name: Collect Python wheel
        run: cp crates/cobre-python/dist/*.whl dist/

      - name: Validate matching CLI and wheel
        run: |
          python -m pip install --no-deps dist/*.whl
          python -m pip install pytest numpy pyarrow
          python scripts/benchmarks/verify_runtime_018.py --cli dist/cli/cobre --case examples/1dtoy
          python -m pytest -q crates/cobre-python/tests/test_periodic_checkpoint.py crates/cobre-python/tests/test_affinity_parity.py --require-cli-binary

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.arch }}
          path: |
            dist/*.tar.xz
            dist/*.whl

  publish:
    if: ${{ github.repository == 'Myria-solucoes/cobre' && !inputs.validate_only }}
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PRERELEASE: true
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          merge-multiple: true
          path: dist
      - name: Publish immutable GitHub Release
        run: |
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -name '*.tar.xz' | wc -l)" -eq 2
          sha256sum dist/* > dist/SHA256SUMS
          release_options=()
          if [[ "$PRERELEASE" == "true" ]]; then
            release_options+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "${release_options[@]}" \
            --target "$GITHUB_SHA" \
            --title "Myria Cobre runtime ${RELEASE_TAG#v}" \
            --notes "Pinned Myria runtime built from ${GITHUB_SHA}. CLI and Python artifacts validated on native Linux x86_64 and ARM64." \
            dist/*.tar.xz dist/*.whl dist/SHA256SUMS
